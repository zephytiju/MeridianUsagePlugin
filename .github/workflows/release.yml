# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to recover
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d usage_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      clickhouse:
        image: clickhouse/clickhouse-server@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
        env:
          CLICKHOUSE_USER: usage
          CLICKHOUSE_PASSWORD: usage-test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "clickhouse-client --user usage --password usage-test --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      USAGE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/usage_test
      USAGE_TEST_CLICKHOUSE_PORT: "8123"
      USAGE_TEST_CLICKHOUSE_RELEASE: "25.8"
      SOURCE_DATE_EPOCH: "1787702400"
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - run: python -m pip install --disable-pip-version-check pip==26.2
      - run: python -m pip install --require-hashes -r requirements-release.txt
      - run: python -m pip install --disable-pip-version-check -e '.[test]'
      - run: python -m pip check
      - run: |
          ruff format --check .
          ruff check .
          mypy src
          python scripts/verify_contracts.py
          pytest
      - run: |
          python -m build --no-isolation --outdir dist
          twine check dist/*
          python scripts/verify_artifacts.py dist
          cd dist && sha256sum meridian_plugin_usage-* > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/meridian_plugin_usage-*"

  github-release:
    name: Publish GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes

  pypi:
    name: Publish PyPI
    if: github.event_name == 'push'
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/meridian-plugin-usage
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Select distributions
        run: |
          mkdir -p publish
          cp dist/*.whl dist/*.tar.gz publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/
