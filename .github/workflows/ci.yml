# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d usage_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      USAGE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/usage_test
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check pip==26.2
      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Verify source
        run: |
          ruff format --check .
          ruff check .
          mypy src
      - name: Verify released contracts
        run: python scripts/verify_contracts.py
      - name: Run conformance tests
        run: pytest

  legacy:
    name: Legacy Usage ${{ matrix.usage }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d usage_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - usage: "1.0.0"
            cost: "meridian-plugin-cost==1.0.0"
          - usage: "1.0.2"
            cost: ""
    env:
      USAGE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/usage_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install a coherent released dependency set
        run: >-
          python -m pip install meridian-plugin-usage==${{ matrix.usage }}
          ${{ matrix.cost }} meridian-storage-postgresql==1.0.0 pytest==9.0.3
      - run: python -m pip check
      - name: Reproduce the released defect and verify frozen v1 records
        run: python scripts/reproduce_decimal_v1.py > legacy-reproduction.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-usage-${{ matrix.usage }}
          path: legacy-reproduction.json
          if-no-files-found: error

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check pip==26.2
      - run: python -m pip install --disable-pip-version-check -e '.[test]'
      - run: bandit -r src -c pyproject.toml
      - run: pip-audit --skip-editable

  package:
    name: Package
    needs: [test, security, legacy]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1787702400"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check pip==26.2
      - run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Build twice
        run: |
          python -m build --no-isolation --outdir dist-a
          python -m build --no-isolation --outdir dist-b
      - name: Verify distributions
        run: |
          twine check dist-a/*
          python scripts/verify_artifacts.py dist-a
          python scripts/compare_artifacts.py dist-a dist-b
          cd dist-a && sha256sum meridian_plugin_usage-* > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meridian-plugin-usage-1.0.3
          path: dist-a/
          if-no-files-found: error
          retention-days: 30
